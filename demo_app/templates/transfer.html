{% extends "base.html" %}

{% block title %}
Internal Transfer
{% endblock %}

{% block content %}

<div class="panel">

    <div class="panel-title">
        Internal Transfer
    </div>

    <div class="form-row">

        <p>
            From:
            <strong>{{ source_account["account_id"] }}</strong>
        </p>

        <p>
            Available Balance:
            <strong>{{ source_account["balance_cents"] | money }}</strong>
        </p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <!-- User selects another account owned by the member -->
            <label for="destination_account_id">
                Transfer To:
            </label>

            <select
                id="destination_account_id"
                name="destination_account_id"
                required
            >

                {% for account in destination_accounts %}

                    <option value="{{ account['account_id'] }}">
                        {{ account["account_type"] }}
                        - {{ account["account_id"] }}
                    </option>

                {% endfor %}

            </select>

            <br><br>

            <label for="amount">
                Amount:
            </label>

            <input
                type="number"
                id="amount"
                name="amount"
                step="0.01"
                min="0.01"
                required
            >

            <button type="submit">
                Review Transfer
            </button>

        </form>

    </div>

</div>

{% endblock %}
